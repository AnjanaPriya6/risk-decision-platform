openapi: 3.0.3

info:
  title: Decision Service API
  version: 0.1.0
  description: >
    Decision Service evaluates authentication events and returns a risk-based decision
    (ALLOW, STEP_UP, BLOCK) with explainable reason codes.

servers:
  - url: http://localhost:8080

paths:
  /v1/decisions/login-attempt:
    post:
      summary: Evaluate login attempt
      description: Evaluates a login attempt event and returns a risk-based decision.
      operationId: evaluateLoginAttempt

      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
          description: >
            Optional correlation id for distributed tracing. If not provided, the service generates one.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginAttemptRequest"
            examples:

              loginAttempt_lowRisk_allow:
                summary: Low-risk login from known device and normal behavior (expected ALLOW)
                value:
                  event_type: LOGIN_ATTEMPT
                  user:
                    user_id: U123
                    account_age_days: 365
                  context:
                    timestamp: "2026-03-05T12:30:00Z"
                    channel: MOBILE
                    ip_address: "203.0.113.10"
                    user_agent: "Mozilla/5.0 ..."
                    device:
                      device_id: "device_known_001"
                      is_new_device: false
                    geo:
                      country: IN
                      city: Hyderabad
                      distance_from_last_login_km: 5
                      minutes_since_last_login: 1440
                      is_new_country: false
                  signals:
                    failed_attempts_last_10m: 0
                    login_attempts_last_10m: 1
                    ip_reputation: 0.05

              loginAttempt_newDevice_stepUp:
                summary: New device + moderately high risk signals (expected STEP_UP)
                value:
                  event_type: LOGIN_ATTEMPT
                  user:
                    user_id: U456
                    account_age_days: 120
                  context:
                    timestamp: "2026-03-05T02:10:00Z"
                    channel: WEB
                    ip_address: "203.0.113.77"
                    user_agent: "Mozilla/5.0 ..."
                    device:
                      device_id: "device_new_abc"
                      is_new_device: true
                    geo:
                      country: IN
                      city: Mumbai
                      distance_from_last_login_km: 1200
                      minutes_since_last_login: 30
                      is_new_country: false
                  signals:
                    failed_attempts_last_10m: 2
                    login_attempts_last_10m: 3
                    ip_reputation: 0.20

              loginAttempt_bruteforce_block:
                summary: High failed attempts indicating brute force (expected BLOCK)
                value:
                  event_type: LOGIN_ATTEMPT
                  user:
                    user_id: U789
                    account_age_days: 30
                  context:
                    timestamp: "2026-03-05T12:31:00Z"
                    channel: API
                    ip_address: "203.0.113.200"
                    user_agent: "curl/8.0"
                    device:
                      device_id: "device_unknown_x"
                      is_new_device: true
                    geo:
                      country: IN
                      city: Bengaluru
                      distance_from_last_login_km: 15
                      minutes_since_last_login: 10
                      is_new_country: false
                  signals:
                    failed_attempts_last_10m: 7
                    login_attempts_last_10m: 10
                    ip_reputation: 0.30

              loginAttempt_badIp_block:
                summary: Very high IP reputation score (expected BLOCK)
                value:
                  event_type: LOGIN_ATTEMPT
                  user:
                    user_id: U321
                    account_age_days: 800
                  context:
                    timestamp: "2026-03-05T12:40:00Z"
                    channel: WEB
                    ip_address: "198.51.100.99"
                    user_agent: "Mozilla/5.0 ..."
                    device:
                      device_id: "device_known_777"
                      is_new_device: false
                    geo:
                      country: IN
                      city: Hyderabad
                      distance_from_last_login_km: 0
                      minutes_since_last_login: 60
                      is_new_country: false
                  signals:
                    failed_attempts_last_10m: 1
                    login_attempts_last_10m: 2
                    ip_reputation: 0.98

              loginAttempt_impossibleTravel_block:
                summary: Large geo distance in a short time window (expected BLOCK)
                value:
                  event_type: LOGIN_ATTEMPT
                  user:
                    user_id: U654
                    account_age_days: 500
                  context:
                    timestamp: "2026-03-05T12:45:00Z"
                    channel: MOBILE
                    ip_address: "203.0.113.150"
                    user_agent: "Mozilla/5.0 ..."
                    device:
                      device_id: "device_known_999"
                      is_new_device: false
                    geo:
                      country: US
                      city: New York
                      distance_from_last_login_km: 12500
                      minutes_since_last_login: 45
                      is_new_country: true
                  signals:
                    failed_attempts_last_10m: 0
                    login_attempts_last_10m: 1
                    ip_reputation: 0.10

      responses:
        "200":
          description: Decision successfully evaluated
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Correlation id for tracing across services.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginAttemptResponse"
              examples:

                decision_allow_lowRisk:
                  summary: Low-risk login allowed
                  value:
                    correlation_id: "c-1a2b3c4d-allow"
                    decision: ALLOW
                    reason_codes: [LOW_RISK]
                    risk_score: 0.12
                    policy_version: "2026-03-05.1"
                    model_version: "risk-v0.1.0"
                    decision_time_ms: 22

                decision_stepUp_newDevice:
                  summary: Step-up required due to new device and elevated risk
                  value:
                    correlation_id: "c-1a2b3c4d-stepup"
                    decision: STEP_UP
                    reason_codes: [NEW_DEVICE, RISK_SCORE_HIGH]
                    risk_score: 0.82
                    policy_version: "2026-03-05.1"
                    model_version: "risk-v0.1.0"
                    decision_time_ms: 45

                decision_block_bruteforce:
                  summary: Block due to brute force pattern
                  value:
                    correlation_id: "c-1a2b3c4d-block"
                    decision: BLOCK
                    reason_codes: [BRUTE_FORCE_SUSPECTED]
                    risk_score: 0.91
                    policy_version: "2026-03-05.1"
                    model_version: "risk-v0.1.0"
                    decision_time_ms: 38

        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRequest_missingField:
                  summary: Missing required field
                  value:
                    code: INVALID_REQUEST
                    message: "Missing required field: context.timestamp"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized_missingToken:
                  summary: Token missing or invalid
                  value:
                    code: UNAUTHORIZED
                    message: "Invalid or missing token"

        "503":
          description: Risk scoring service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                riskServiceUnavailable:
                  summary: Downstream scoring service unavailable
                  value:
                    code: RISK_SERVICE_UNAVAILABLE
                    message: "Risk scoring service unavailable"

components:
  schemas:
    LoginAttemptRequest:
      type: object
      additionalProperties: false
      required: [event_type, user, context, signals]
      properties:
        event_type:
          type: string
          enum: [LOGIN_ATTEMPT]
        user:
          $ref: "#/components/schemas/UserContext"
        context:
          $ref: "#/components/schemas/RequestContext"
        signals:
          $ref: "#/components/schemas/LoginSignals"

    UserContext:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          type: string
        account_age_days:
          type: integer
          minimum: 0

    RequestContext:
      type: object
      additionalProperties: false
      required: [timestamp, channel, ip_address, device, geo]
      properties:
        timestamp:
          type: string
          format: date-time
        channel:
          type: string
          enum: [WEB, MOBILE, API]
        ip_address:
          type: string
        user_agent:
          type: string
        device:
          $ref: "#/components/schemas/DeviceContext"
        geo:
          $ref: "#/components/schemas/GeoContext"

    DeviceContext:
      type: object
      additionalProperties: false
      required: [device_id, is_new_device]
      properties:
        device_id:
          type: string
        is_new_device:
          type: boolean

    GeoContext:
      type: object
      additionalProperties: false
      required: [country, city]
      properties:
        country:
          type: string
        city:
          type: string
        distance_from_last_login_km:
          type: number
          minimum: 0
        minutes_since_last_login:
          type: integer
          minimum: 0
        is_new_country:
          type: boolean

    LoginSignals:
      type: object
      additionalProperties: false
      required: [failed_attempts_last_10m, login_attempts_last_10m, ip_reputation]
      properties:
        failed_attempts_last_10m:
          type: integer
          minimum: 0
        login_attempts_last_10m:
          type: integer
          minimum: 0
        ip_reputation:
          type: number
          minimum: 0
          maximum: 1

    LoginAttemptResponse:
      type: object
      required:
        - correlation_id
        - decision
        - reason_codes
        - risk_score
        - policy_version
        - model_version
        - decision_time_ms
      properties:
        correlation_id:
          type: string
        decision:
          type: string
          enum: [ALLOW, STEP_UP, BLOCK]
        reason_codes:
          type: array
          items:
            type: string
        risk_score:
          type: number
          minimum: 0
          maximum: 1
        policy_version:
          type: string
        model_version:
          type: string
        decision_time_ms:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string